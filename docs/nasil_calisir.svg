      <path d="M0 0L10 5L0 10z" fill="#8A6F63"/>
    </marker>
  </defs>
  <rect width="860" height="560" rx="16" fill="#F8E9E5"/>

  <!-- Girişler -->
  <g font-size="15" text-anchor="middle">
