    <text x="700" y="92" font-size="13" fill="#7A6158">Ambalajdaki tablodan</text>
  </g>

  <g fill="none" stroke="#8A6F63" stroke-width="1.5">
    <path d="M160 110V140H430"/><path d="M700 110V140H430"/>
    <path d="M430 110V168" marker-end="url(#ok)"/>
    <path d="M430 240V278" marker-end="url(#ok)"/>
    <path d="M430 350V388" marker-end="url(#ok)"/>
    <path d="M430 460V478" marker-end="url(#ok)"/>
    <path d="M590 205H628" marker-end="url(#ok)"/>
  </g>

  <g font-size="15" text-anchor="middle">
